<!DOCTYPE html>
<html lang="pt-BR" data-pv-part="portaria">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Portaria · Credenciamento - Ruby Rose · Preview</title>
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:">

  <link rel="icon" href="assets/icon.png?v=202611101951" type="image/png">
  <link rel="icon" href="assets/icon.svg?v=202611101951" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.png?v=202611101951">

  <style>
    /* A portaria leva a marca na assinatura e na tipografia, e só. Verde e
       vermelho de veredito continuam sendo verde e vermelho: são lidos de
       relance, em pé, por quem tem uma fila pela frente, e trocá-los por rosa
       custaria mais do que a marca ganha. */
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/montserrat-latin-400-normal.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('assets/fonts/montserrat-latin-600-normal.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('assets/fonts/montserrat-latin-700-normal.woff2') format('woff2');
    }

    :root {
      color-scheme: light dark;
      --border: #ece2e6;
      --muted: #6b5e64;
      --surface: #ffffff;
      --text: #2b2228;
      --brand: #f03a77;
      --ok: #1b5e20;
      --ok-bg: #e6f4e8;
      --deny: #b3261e;
      --deny-bg: #fceceb;
      --warn: #7a4b00;
      --warn-bg: #fdf0d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --border: #45484d;
        --muted: #a8adb5;
        --surface: #1a1c1e;
        --text: #e3e2e6;
        --ok: #a5d6a7;
        --ok-bg: #16301a;
        --deny: #f2b8b5;
        --deny-bg: #3a1512;
        --warn: #f0c26b;
        --warn-bg: #33260c;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1.5rem 1rem 3rem;
      background: var(--surface);
      color: var(--text);
      font: 16px/1.5 'Montserrat', system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main { max-width: 30rem; margin: 0 auto; }

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }

    h1 { font-size: 1.25rem; margin: 0; }

    /* A assinatura fica pequena e ao lado do título: identifica de quem é a
       portaria sem disputar espaço com o veredito, que é o que importa aqui. */
    .brand { display: block; width: 92px; height: auto; margin-bottom: .35rem; }

    .lock {
      width: auto;
      padding: .35rem .6rem;
      font-size: .75rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    label { display: block; font-weight: 600; margin-bottom: .35rem; font-size: .9rem; }

    input {
      width: 100%;
      padding: .75rem;
      border: 1px solid var(--border);
      border-radius: .375rem;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    /* O PIN é digitado de pé, muitas vezes com pressa: dígitos grandes e
       espaçados reduzem erro de digitação na entrada do evento. */
    #pin {
      font-size: 1.75rem;
      letter-spacing: .5em;
      text-align: center;
      padding: .75rem .5rem;
    }

    #token { font-family: ui-monospace, "SF Mono", monospace; font-size: .8rem; }

    .hint { display: block; color: var(--muted); font-size: .8rem; margin-top: .4rem; }

    .field { margin-bottom: 1.25rem; }

    button {
      width: 100%;
      padding: .9rem;
      border: 0;
      border-radius: .375rem;
      background: var(--text);
      color: var(--surface);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }

    button[disabled] { opacity: .6; cursor: progress; }

    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* O resultado é lido de relance, a um braço de distância. */
    .result {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border-radius: .5rem;
      border: 2px solid;
      text-align: center;
    }

    .result:empty { display: none; }

    .result .status { font-size: 1.4rem; font-weight: 700; margin: 0 0 .35rem; }
    .result .who { font-size: 1.1rem; margin: 0 0 .25rem; }
    .result .detail { font-size: .85rem; margin: 0; opacity: .85; }

    /* O aviso de ensaio precisa destoar do veredito: quem lê de relance tem que
       perceber que aquele "entrada liberada" não conferiu a data. Por isso a
       faixa própria, e não mais uma linha de texto na mesma cor das outras. */
    .result .flag {
      font-size: .8rem;
      font-weight: 600;
      margin: .75rem 0 0;
      padding: .4rem .5rem;
      border-radius: .25rem;
      border: 1px dashed currentColor;
      opacity: .9;
    }

    .result.is-ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
    .result.is-deny { border-color: var(--deny); background: var(--deny-bg); color: var(--deny); }
    .result.is-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }

    /* A câmera é o caminho normal da portaria, então o botão dela abre a tela
       junto com o terminal liberado, e não só depois do primeiro veredito. O
       campo de token fica embaixo, como alternativa para a leitura que chega de
       fora — pela URL do QR Code ou colada à mão. */
    #scan { margin-bottom: 1.5rem; }

    /* Depois do veredito sobra só limpar a tela: a leitura seguinte sai do
       mesmo botão de câmera, que nunca saiu do lugar. */
    .after { display: grid; gap: .5rem; margin-top: 1rem; }

    .scanner { display: grid; gap: .5rem; margin-top: 1rem; }

    /* Quadrado: o QR Code é quadrado e a portaria mira de perto, em pé. */
    .scanner video {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: .5rem;
      background: #000;
    }

    /* Ocupa o lugar do botão quando não há câmera para abrir, e por isso carrega
       o mesmo espaçamento embaixo. */
    .scan-note { color: var(--muted); font-size: .85rem; text-align: center; margin: 0 0 1.5rem; }

    [hidden] { display: none !important; }
  </style>
<link rel="stylesheet" href="assets/kit.css?v=202611101951">
<script src="assets/demo-data.js?v=202611101951"></script>
<script src="assets/demo-api.js?v=202611101951"></script>
<style>/* preview: a faixa de aviso ocupa o topo */ body { padding-top: calc(var(--pv-h) + 1.5rem) !important; }</style>
</head>

<body>
  <main>
    <header>
      <div>
        <img src="assets/ruby-rose-logo.svg?v=202611101951" alt="Ruby Rose" class="brand" width="92" height="20">
        <h1>Portaria</h1>
      </div>
      <button type="button" id="lock" class="lock" hidden>Esquecer PIN</button>
    </header>

    <!-- Primeiro passo: o PIN do evento. Fica guardado no aparelho para que a
         fila não pare a cada pessoa, e sai com o botão "Esquecer PIN". -->
    <form id="pin-form" hidden>
      <div class="field">
        <label for="pin">PIN da portaria</label>
        <input id="pin" name="pin" inputmode="numeric" autocomplete="off" autofocus>
        <span class="hint">Definido pelo administrador no cadastro do evento.</span>
      </div>

      <button type="submit">Liberar terminal</button>
    </form>

    <!-- Leitura pela câmera dentro do próprio terminal, oferecida assim que o PIN
         libera a tela. Sem isto a portaria sai da página e abre o app de câmera a
         cada pessoa da fila. -->
    <button type="button" id="scan" hidden>Ler QR Code</button>

    <!-- Onde o navegador não lê QR Code, o lugar do botão vira a explicação do
         porquê. Botão que não faz nada é pior que botão nenhum. -->
    <p class="scan-note" id="scan-note" hidden></p>

    <section class="scanner" id="scanner" hidden>
      <video id="preview" playsinline muted></video>
      <button type="button" id="scan-stop" class="secondary">Fechar câmera</button>
    </section>

    <!-- O caminho manual: token que chegou pela URL do QR Code ou colado à mão.
         Fica abaixo da câmera porque é a exceção, não a regra. -->
    <form id="check-in-form" hidden>
      <div class="field">
        <label for="token">Credencial</label>
        <input id="token" name="token" autocomplete="off" placeholder="Leia o QR Code ou cole o token">
        <span class="hint" id="token-hint">Preenchido pela leitura do QR Code. Também aceita o token colado.</span>
      </div>

      <button type="submit" id="submit" class="secondary">Validar entrada</button>

      <!-- Só no preview: lê o QR Code de um arquivo (o PNG ou o SVG baixado no formulário) com o
           mesmo leitor da câmera, para testar sem câmera. -->
      <button type="button" id="scan-file" class="secondary" style="margin-top: .5rem">Ler de uma imagem</button>
      <input type="file" id="scan-file-input" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden>
    </form>

    <div class="result" id="result" aria-live="assertive" role="status"></div>

    <div class="after" id="after" hidden>
      <button type="button" id="next" class="secondary">Próxima pessoa</button>
    </div>
  </main>

  <script>
    const CHECK_IN_ENDPOINT = "https://api.demonstracao.invalid/gate/check-in"; // preview: API simulada (assets/demo-api.js)

    // O PIN fica no aparelho da portaria porque cada leitura de QR Code recarrega
    // a página: sem guardar, seria redigitado a cada pessoa da fila. É um terminal
    // dedicado e o botão "Esquecer PIN" apaga na hora. Nunca vai para o QR Code
    // nem para a URL — só para o corpo da requisição.
    const PIN_STORAGE_KEY = "rubyrose.gate.pin";

    const pinForm = document.getElementById("pin-form");
    const checkInForm = document.getElementById("check-in-form");
    const lockButton = document.getElementById("lock");
    const nextButton = document.getElementById("next");
    const submit = document.getElementById("submit");
    const result = document.getElementById("result");
    const tokenInput = document.getElementById("token");
    const pinInput = document.getElementById("pin");
    const afterActions = document.getElementById("after");
    const scanButton = document.getElementById("scan");
    const scanner = document.getElementById("scanner");
    const preview = document.getElementById("preview");
    const stopScanButton = document.getElementById("scan-stop");
    const scanNote = document.getElementById("scan-note");

    // Leitura de QR Code pela câmera. A única condição que a página não resolve
    // sozinha é o contexto seguro: sem HTTPS o navegador não expõe
    // `navigator.mediaDevices` e não existe câmera para abrir, em aparelho nenhum.
    //
    // O decodificador tem dois caminhos. Onde o navegador traz o BarcodeDetector
    // — Chrome, Edge — usamos o nativo e nada é baixado. Onde não traz, e isso
    // inclui todo aparelho iOS, porque o WebKit não implementa a API, o ZXing em
    // WebAssembly entra no lugar, servido daqui mesmo.
    const SCAN_LABEL = "Ler QR Code";
    const SCAN_FORMAT = "qr_code";
    const SCAN_INTERVAL = 250;
    const PONYFILL_SRC = "vendor/barcode-detector.ponyfill.js";
    const READER_WASM_SRC = "vendor/zxing_reader.wasm";

    let scanning = false;
    let detector = null;
    let stream = null;
    let scanTimer = null;
    let loadingReader = null;

    let scanBlockedReason = blockedReason();

    function blockedReason() {
      if (navigator.mediaDevices?.getUserMedia) return null;

      // Faltar câmera tem duas causas e elas mandam procurar em lugares opostos.
      // Fora de contexto seguro o navegador esconde a câmera inteira. Mas o
      // mesmo buraco aparece em iOS anterior ao 14.3, onde só o Safari a
      // alcançava — ali o endereço está certo e quem está velho é o aparelho.
      return window.isSecureContext
        ? "Este navegador não dá acesso à câmera. Atualize o aparelho ou leia o QR Code pelo app de câmera."
        : "A câmera só funciona com a portaria aberta em HTTPS.";
    }

    // O nativo só serve se souber ler QR Code. Nenhuma implementação conhecida
    // deixa esse formato de fora, mas perguntar é barato e a alternativa já está
    // pronta: cair no ZXing custa um download, não uma fila parada.
    async function nativeReader() {
      if (!("BarcodeDetector" in window)) return null;

      try {
        const formats = await BarcodeDetector.getSupportedFormats();

        return formats.includes(SCAN_FORMAT) ? BarcodeDetector : null;
      } catch {
        return null;
      }
    }

    // Baixado uma vez, e só onde falta o nativo: são ~1 MB de WebAssembly, e
    // cobrar isso de quem já tem a API seria castigo por nada.
    function loadBundledReader() {
      loadingReader ||= new Promise((resolve, reject) => {
        const tag = document.createElement("script");

        tag.src = PONYFILL_SRC;
        tag.onload = resolve;
        tag.onerror = () => reject(new Error("o leitor não carregou"));
        document.head.append(tag);
      }).then(() => {
        // O .wasm sai do nosso servidor, nunca de CDN. O padrão do pacote é
        // buscar no jsDelivr, e depender de host externo na entrada do evento é
        // trocar um problema de fila por outro.
        return BarcodeDetectionAPI.prepareZXingModule({
          overrides: {
            locateFile: (path, prefix) => (path.endsWith(".wasm") ? READER_WASM_SRC : prefix + path)
          },
          fireImmediately: true
        });
      }).then(() => BarcodeDetectionAPI.BarcodeDetector);

      return loadingReader;
    }

    async function readerClass() {
      return (await nativeReader()) ?? (await loadBundledReader());
    }

    function storedPin() {
      try {
        return localStorage.getItem(PIN_STORAGE_KEY) || "";
      } catch {
        // Navegador com armazenamento bloqueado: o terminal ainda funciona,
        // só volta a pedir o PIN a cada leitura.
        return "";
      }
    }

    function rememberPin(pin) {
      try {
        localStorage.setItem(PIN_STORAGE_KEY, pin);
      } catch {
        /* segue sem guardar */
      }
    }

    function forgetPin() {
      try {
        localStorage.removeItem(PIN_STORAGE_KEY);
      } catch {
        /* nada a fazer */
      }
    }

    // O token chega pela URL quando a pessoa lê o QR Code, que aponta para cá.
    // Passa pelo extractToken porque leitor de câmera do próprio aparelho às
    // vezes engole o fim do payload junto com o link e abre esta página com
    // `?token=<uuid>"}`.
    function tokenFromUrl() {
      return extractToken(new URLSearchParams(location.search).get("token"));
    }

    function render() {
      const unlocked = storedPin() !== "";

      pinForm.hidden = unlocked || scanning;
      checkInForm.hidden = !unlocked || scanning;
      lockButton.hidden = !unlocked;

      // A câmera é o que a portaria usa em toda pessoa da fila, então o botão
      // está de pé desde o primeiro instante do terminal liberado. Esperar o
      // primeiro veredito para oferecê-lo obrigava a primeira leitura a sair do
      // app de câmera do aparelho, justo a saída que esta tela existe para
      // evitar. Onde a câmera não é uma opção, o botão dá lugar ao motivo.
      const offerScan = unlocked && !scanning;

      scanButton.hidden = !offerScan || scanBlockedReason !== null;
      scanNote.hidden = !offerScan || scanBlockedReason === null;
      scanNote.textContent = scanBlockedReason ?? "";

      // Só o PIN puxa o foco, e o campo de token não puxa mais nenhum: no
      // celular da portaria o teclado subiria por cima do botão da câmera assim
      // que o terminal libera, escondendo justamente o primeiro toque esperado —
      // e por cima da imagem, com a câmera aberta, justo na hora de mirar.
      if (!unlocked) pinInput.focus();
    }

    // Depois do veredito sobra limpar a tela: o botão da câmera já está visível
    // o tempo todo e não depende deste passo.
    function showAfterResult(visible) {
      afterActions.hidden = !visible;
    }

    pinForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const pin = pinInput.value.trim();

      if (pin === "") return;

      rememberPin(pin);
      pinInput.value = "";
      render();

      // Se a pessoa já chegou com o QR Code lido, valida sem pedir mais nada.
      if (tokenInput.value !== "") checkInForm.requestSubmit();
    });

    lockButton.addEventListener("click", () => {
      forgetPin();
      // Terminal trancado com a câmera aberta continuaria filmando a entrada.
      stopScan();
      clearResult();
      render();
    });

    nextButton.addEventListener("click", resetTerminal);
    scanButton.addEventListener("click", startScan);
    stopScanButton.addEventListener("click", stopScan);

    // Câmera ligada com a tela em segundo plano é bateria indo embora no meio do
    // evento, e em alguns aparelhos o navegador corta o vídeo de qualquer forma.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopScan();
    });

    function resetTerminal() {
      // Tira o token da URL para que um recarregamento não revalide a mesma
      // credencial e mostre "já utilizada" sem ninguém ter passado.
      history.replaceState(null, "", location.pathname);
      tokenInput.value = "";
      clearResult();
      render();
    }

    async function startScan() {
      // Marcado antes de qualquer render: sem isto o foco voltaria ao campo de
      // token e o teclado subiria por cima da câmera.
      scanning = true;

      // O veredito anterior continua na tela enquanto prepara. Na primeira vez
      // em que o leitor é baixado isso leva alguns segundos, e uma tela que não
      // muda faz a portaria tocar o botão de novo.
      scanButton.disabled = true;
      scanButton.textContent = "Abrindo a câmera…";

      // A câmera é pedida primeiro e sem await antes dela: em iOS, encostar um
      // download de 1 MB entre o toque e o getUserMedia rompe o vínculo com o
      // gesto. As duas coisas correm juntas, que também é o mais rápido.
      const camera = navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }
      });
      const reader = readerClass();

      try {
        const [ opened, Reader ] = await Promise.all([ camera, reader ]);

        stream = opened;
        detector ||= new Reader({ formats: [ SCAN_FORMAT ] });
      } catch (error) {
        // Câmera aberta com leitor quebrado deixaria a track ligada sem dono.
        camera.then((opened) => opened.getTracks().forEach((track) => track.stop())).catch(() => {});

        resetScanButton();
        stopScan();
        show("warn", "Leitura indisponível", "", scanFailure(error));
        showAfterResult(true);
        return;
      }

      resetScanButton();
      resetTerminal();

      preview.srcObject = stream;
      scanner.hidden = false;
      // O play pode ser recusado por política de autoplay. Não é fatal: o quadro
      // congela, a leitura falha e a portaria fecha a câmera e tenta de novo.
      preview.play().catch(() => {});

      scanTimer = setInterval(readFrame, SCAN_INTERVAL);
      render();
    }

    function resetScanButton() {
      scanButton.disabled = false;
      scanButton.textContent = SCAN_LABEL;
    }

    // Desligar as tracks é obrigatório: sem isso a câmera segue ligada, com o
    // indicador aceso, mesmo com o vídeo fora da tela.
    function stopScan() {
      scanning = false;

      clearInterval(scanTimer);
      scanTimer = null;

      stream?.getTracks().forEach((track) => track.stop());
      stream = null;

      preview.srcObject = null;
      scanner.hidden = true;
      render();
    }

    async function readFrame() {
      if (!scanning) return;

      let codes = [];

      try {
        codes = await detector.detect(preview);
      } catch {
        // Quadro tremido ou vídeo ainda sem dimensão: o próximo tenta de novo.
        return;
      }

      // Só no preview: o QR de um cadastro feito em outro aparelho traz no link os dados da demonstração.
      codes.forEach((code) => window.RRDemo?.learn(code.rawValue));

      const token = codes.map((code) => tokenFromScan(code.rawValue)).find(Boolean);

      if (!token) return;

      stopScan();
      tokenInput.value = token;
      checkInForm.requestSubmit();
    }

    // O token é um UUID gerado pelo servidor, e é essa forma fixa que decide o
    // que é credencial dentro do texto lido. Recortar por delimitador não serve:
    // o payload traz a validation_url, que termina no próprio token seguido das
    // aspas e da chave do JSON, e qualquer recorte por `?` ou `=` arrasta esse
    // `"}` junto — foi o que a portaria mandou para o servidor e voltou como
    // credencial inválida com a credencial certa na mão.
    const TOKEN_PATTERN = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;

    function extractToken(value) {
      return String(value ?? "").match(TOKEN_PATTERN)?.[0] ?? "";
    }

    // O QR Code carrega o payload JSON emitido pelo servidor, mas a leitura
    // aceita também a validation_url e o token cru: credencial impressa em lote
    // antigo não pode virar fila parada na porta. Os três formatos caem no mesmo
    // extractToken, então basta o UUID aparecer em algum lugar do texto lido.
    function tokenFromScan(raw) {
      const value = (raw ?? "").trim();

      if (value === "") return "";

      try {
        const payload = JSON.parse(value);

        if (payload?.token) return extractToken(payload.token);
        if (payload?.validation_url) return extractToken(payload.validation_url);
      } catch {
        /* não era JSON */
      }

      return extractToken(value);
    }

    function scanFailure(error) {
      if (error.name === "NotAllowedError") {
        return "A permissão de câmera foi negada. Libere nas configurações do navegador.";
      }

      if (error.name === "NotFoundError") return "Nenhuma câmera encontrada neste aparelho.";

      return `Não foi possível iniciar a leitura (${error.message || error.name}).`;
    }

    checkInForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      // O campo também aceita texto colado, que costuma vir com o payload
      // inteiro em volta do token. O que sai daqui é sempre o UUID limpo, e o
      // campo passa a mostrar exatamente o que foi enviado.
      const typed = tokenInput.value.trim();
      const token = extractToken(typed);

      if (token === "") {
        const reason = typed === ""
          ? "Leia o QR Code ou cole o token."
          : "O texto no campo não tem uma credencial. Leia o QR Code de novo.";

        show("warn", "Sem credencial", reason);
        return;
      }

      tokenInput.value = token;

      lock(true);

      try {
        const response = await fetch(CHECK_IN_ENDPOINT, {
          method: "POST",
          headers: { "Accept": "application/json", "Content-Type": "application/json" },
          body: JSON.stringify({ token, pin: storedPin() })
        });

        const body = await response.json().catch(() => null);

        handle(response.status, body);
      } catch (error) {
        show("warn", "Sem conexão", `A requisição não chegou ao servidor (${error.message}).`);
      } finally {
        lock(false);
      }
    });

    // Cada resposta do backend vira um veredito só, legível de longe.
    function handle(status, body) {
      if (status === 200) {
        const entered = new Date(body.accreditation.checked_in_at);
        show("ok", "Entrada liberada", body.accreditation.name,
             `Check-in às ${entered.toLocaleTimeString("pt-BR")}`,
             // No evento em teste a entrada sai liberada sem conferir a data, e
             // a tela precisa dizer isso: se aparecer no dia do evento de
             // verdade, é o teste que ficou ligado.
             body.testing ? "Evento em teste: a data da credencial não foi conferida." : "");
      } else if (status === 403 && body?.status === "wrong_day") {
        // Não é credencial queimada nem inválida: é a pessoa no dia errado. A
        // data certa aparece na tela para a portaria orientar na hora.
        show("deny", "Dia errado", "", body.message);
      } else if (status === 403) {
        show("deny", "Credencial já utilizada", "", "Esta pessoa já entrou. Chame a coordenação.");
      } else if (status === 401) {
        // PIN errado invalida o terminal inteiro: não adianta tentar a próxima
        // pessoa com o mesmo PIN guardado.
        forgetPin();
        show("deny", "PIN inválido", "", "Informe o PIN do evento novamente.");
      } else if (status === 404 || status === 410) {
        show("deny", "Credenciamento inválido", "", body?.message || "Credencial não reconhecida ou expirada.");
      } else {
        show("warn", "Falha inesperada", "", `O servidor respondeu HTTP ${status}.`);
      }

      showAfterResult(true);
      render();
    }

    function show(kind, status, who, detail, flag) {
      result.className = `result is-${kind}`;
      result.replaceChildren();

      const title = document.createElement("p");
      title.className = "status";
      title.textContent = status;
      result.append(title);

      if (who) {
        const name = document.createElement("p");
        name.className = "who";
        name.textContent = who;
        result.append(name);
      }

      if (detail) {
        const note = document.createElement("p");
        note.className = "detail";
        note.textContent = detail;
        result.append(note);
      }

      if (flag) {
        const warning = document.createElement("p");
        warning.className = "flag";
        warning.textContent = flag;
        result.append(warning);
      }
    }

    function clearResult() {
      result.className = "result";
      result.replaceChildren();
      showAfterResult(false);
    }

    function lock(locked) {
      submit.disabled = locked;
      submit.textContent = locked ? "Validando…" : "Validar entrada";
    }

    // Só no preview: "Ler de uma imagem". Passa pelo mesmo leitor da câmera (BarcodeDetector nativo
    // ou ZXing) e segue o mesmo fluxo: preenche o token e valida com o PIN guardado.
    const scanFileButton = document.getElementById("scan-file");
    const scanFileInput = document.getElementById("scan-file-input");

    scanFileButton.addEventListener("click", () => scanFileInput.click());

    scanFileInput.addEventListener("change", async () => {
      const file = scanFileInput.files[0];
      scanFileInput.value = "";
      if (!file) return;

      scanFileButton.disabled = true;
      scanFileButton.textContent = "Lendo a imagem…";

      try {
        const [ Reader, image ] = await Promise.all([ readerClass(), imageFromFile(file) ]);
        const codes = await new Reader({ formats: [ SCAN_FORMAT ] }).detect(image);

        codes.forEach((code) => window.RRDemo?.learn(code.rawValue));

        const token = codes.map((code) => tokenFromScan(code.rawValue)).find(Boolean);

        if (!token) {
          show("warn", "QR Code não encontrado", "", "A imagem não tem um QR Code de credencial legível.");
          showAfterResult(true);
          return;
        }

        tokenInput.value = token;
        checkInForm.requestSubmit();
      } catch (error) {
        show("warn", "Leitura indisponível", "", `Não foi possível ler a imagem (${error.message || error.name}).`);
        showAfterResult(true);
      } finally {
        scanFileButton.disabled = false;
        scanFileButton.textContent = "Ler de uma imagem";
      }
    });

    // SVG não vira ImageBitmap: desenhado num canvas branco, PNG e SVG passam pelo mesmo leitor.
    function imageFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          const width = img.naturalWidth || 800;
          const height = img.naturalHeight || 800;
          const scale = Math.max(1, 800 / Math.max(width, height));
          const canvas = document.createElement("canvas");

          canvas.width = Math.round(width * scale);
          canvas.height = Math.round(height * scale);

          const context = canvas.getContext("2d");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.imageSmoothingEnabled = false;
          context.drawImage(img, 0, 0, canvas.width, canvas.height);

          URL.revokeObjectURL(url);
          resolve(canvas);
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("o arquivo não é uma imagem"));
        };

        img.src = url;
      });
    }

    tokenInput.value = tokenFromUrl();
    render();

    // QR Code lido com o terminal já liberado: valida de imediato, sem toque.
    if (tokenInput.value !== "" && storedPin() !== "") checkInForm.requestSubmit();
  </script>
