on:
  push:
    branches:
      - main
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    # Gera api/config.php a partir dos secrets do repositório.
    # O arquivo é ignorado pelo git (.gitignore), então só existe aqui,
    # em memória do runner, e vai para o servidor pelo sync abaixo.
    #
    # Cada integração liga sozinha quando o secret correspondente existe.
    # Sem nenhum secret configurado, o arquivo sai com tudo desligado —
    # exatamente o comportamento padrão de api/leads.php.
    - name: 🔐 Gerar api/config.php a partir dos secrets
      env:
        HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_PORTAL_ID }}
        HUBSPOT_EBOOK_STAGE: ${{ secrets.HUBSPOT_EBOOK_STAGE }}
        LEADS_EMAIL_TO: ${{ secrets.LEADS_EMAIL_TO }}
        LEADS_EMAIL_FROM: ${{ secrets.LEADS_EMAIL_FROM }}
        LEADS_EMAIL_TIERS: ${{ secrets.LEADS_EMAIL_TIERS }}
        AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
        AWS_SES_KEY: ${{ secrets.AWS_SES_KEY }}
        AWS_SES_SECRET: ${{ secrets.AWS_SES_SECRET }}
        WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        WHATSAPP_ENDPOINT: ${{ secrets.WHATSAPP_ENDPOINT }}
        WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      run: |
        php -r '
          // var_export() cuida do escaping: um segredo com aspas, barras
          // ou $ não quebra o arquivo nem injeta código.
          $env = static fn(string $k): string => (string) (getenv($k) ?: "");

          $hubspot = $env("HUBSPOT_TOKEN");
          $emailTo = $env("LEADS_EMAIL_TO");
          $sesKey  = $env("AWS_SES_KEY");
          $waToken = $env("WHATSAPP_TOKEN");

          // Faixas comerciais que viram e-mail. Secret opcional: sem ele,
          // notifica morno e quente. "todos" manda tudo, inclusive frio.
          $tiers = array_values(array_filter(array_map("trim", explode(",", strtolower($env("LEADS_EMAIL_TIERS"))))));
          if ($tiers === []) {
              $tiers = ["morno", "quente"];
          } elseif ($tiers === ["todos"]) {
              $tiers = [];
          }

          $config = [
              "health_token" => $env("HEALTH_TOKEN"),

              "allowed_origins" => ["https://www.devbatista.com", "https://devbatista.com"],

              "hubspot_enabled"   => $hubspot !== "",
              "hubspot_token"     => $hubspot,
              "hubspot_portal_id" => $env("HUBSPOT_PORTAL_ID"),

              // Landing page do e-book. Usa o mesmo token do diagnóstico.
              // Sem HUBSPOT_EBOOK_STAGE nenhum negócio é aberto — o contato
              // ainda é criado, só não aparece no board.
              "ebook_hubspot_enabled" => $hubspot !== "",
              "ebook_pipeline"        => "default",
              "ebook_deal_stage"      => $env("HUBSPOT_EBOOK_STAGE"),

              // O material só chega por e-mail: sem SES, não há entrega.
              // Sai do endereço pessoal — o e-book é assinado pelo Rafael e
              // promete resposta direta. Nada aqui é segredo.
              "ebook_email_enabled"   => $sesKey !== "",
              "ebook_download_url"    => "https://www.devbatista.com/materiais/ebook-devbatista-sua-empresa-esta-perdendo-dinheir-com-a-ti.pdf",
              "ebook_email_from"      => "rafael@devbatista.com",
              "ebook_email_from_name" => "Rafael Batista",

              // Só liga com destinatário E credencial: ligado sem chave só
              // encheria o log de erro a cada lead.
              "email_enabled" => $emailTo !== "" && $sesKey !== "",
              "email_to"      => $emailTo,
              "email_from"    => $env("LEADS_EMAIL_FROM"),
              "email_tiers"   => $tiers,
              "ses_region"    => $env("AWS_SES_REGION"),
              "ses_key"       => $sesKey,
              "ses_secret"    => $env("AWS_SES_SECRET"),

              "whatsapp_enabled"  => $waToken !== "",
              "whatsapp_token"    => $waToken,
              "whatsapp_endpoint" => $env("WHATSAPP_ENDPOINT"),
              "whatsapp_to"       => $env("WHATSAPP_TO"),
          ];

          file_put_contents(
              "api/config.php",
              "<?php\n\n// Gerado pelo deploy a partir dos secrets. Não edite à mão.\nreturn " . var_export($config, true) . ";\n"
          );
        '
        # Valida a sintaxe sem imprimir o conteúdo (imprimir vazaria o segredo).
        php -l api/config.php

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Ao declarar exclude, os padrões default são substituídos —
        # por isso os de git precisam ser repetidos aqui.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          api/storage/leads/**
          api/storage/ratelimit/**
          api/storage/integrations/**
