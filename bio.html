<body>
  <noscript><img height="1" width="1" style="display:none" alt=""
  src="https://www.facebook.com/tr?id=1437257638248418&amp;ev=PageView&amp;noscript=1"></noscript>

  <main class="bio">
    <header>
      <div class="bio-logo">
        <img src="/images/icon-256x256.png" alt="Logo da DevBatista" width="72" height="72" fetchpriority="high">
      </div>
      <h1 class="bio-title">DevBatista</h1>
      <p class="bio-tagline">Sistemas, automação e IA</p>
      <p class="bio-desc">Sistemas sob medida, integrações e automação de WhatsApp para pequenas empresas.</p>
    </header>

    <!-- Os links passam por /bio/* para cada clique virar uma página vista
         no Admin (o analytics só conta páginas, não eventos). -->
    <nav class="bio-links" aria-label="Links da DevBatista">
      <a class="bio-btn bio-btn--primary" href="/bio/whatsapp" data-repassa-utm>Conversar no WhatsApp</a>
      <a class="bio-btn" href="/bio/site" data-repassa-utm>Conheça o site</a>
      <a class="bio-btn" href="/bio/linkedin" data-repassa-utm>LinkedIn</a>
    </nav>

    <footer class="bio-footer">
      <p>@_devbatista</p>
    </footer>
  </main>

  <script>
    // Repassa os UTMs desta URL (utm_source, utm_medium, utm_campaign...) aos
    // links, para a origem do clique chegar junto no Admin.
    (function () {
      try {
        var utm = new URLSearchParams();
        new URLSearchParams(window.location.search).forEach(function (valor, chave) {
          if (chave.indexOf('utm_') === 0) utm.append(chave, valor);
        });
        var query = utm.toString();
        if (!query) return;
        var links = document.querySelectorAll('[data-repassa-utm]');
        for (var i = 0; i < links.length; i++) {
          links[i].setAttribute('href', links[i].getAttribute('href') + '?' + query);
        }
      } catch (e) { /* navegador antigo: os links seguem sem UTM */ }
    })();
  </script>
  <script src="/js/visitas.js?v=1" defer></script>
</body>
