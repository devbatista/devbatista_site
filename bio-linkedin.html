<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrindo o LinkedIn | DevBatista</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#071B3C">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <noscript><meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/rbatist10"></noscript>
  <!-- Sem CSS externo nem fonte: nada pode atrasar o redirecionamento. -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #071B3C; color: #F1F6FE; font: 400 1rem/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    p { margin: 0 0 12px; }
    a { color: #7B88F5; }
  </style>
</head>
<body>
  <!-- Passagem do botão "LinkedIn" da /bio: a página vista conta o clique no
       Admin (com os UTMs da URL) e segue para o LinkedIn. -->
  <main>
    <p>Abrindo o LinkedIn…</p>
    <a id="destino" href="https://www.linkedin.com/in/rbatist10">Toque aqui se não abrir</a>
  </main>
  <script>
    // Segue assim que o visitas.js registrar a visita, ou em 800 ms se ele
    // demorar ou falhar.
    (function () {
      var foi = false;
      window.devbatistaSeguir = function () {
        if (foi) return;
        foi = true;
        window.location.replace(document.getElementById('destino').href);
      };
      setTimeout(window.devbatistaSeguir, 800);
    })();
  </script>
  <!-- Síncrono de propósito: o envio da página vista sai antes da linha abaixo. -->
  <script src="/js/visitas.js?v=3"></script>
  <script>window.devbatistaSeguir();</script>
</body>
</html>
