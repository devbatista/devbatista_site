<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrindo o site | DevBatista</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#071B3C">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
  <!-- Sem CSS externo nem fonte: nada pode atrasar o redirecionamento. -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #071B3C; color: #F1F6FE; font: 400 1rem/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    p { margin: 0 0 12px; }
    a { color: #7B88F5; }
  </style>
</head>
<body>
  <!-- Passagem do botão "Conheça o site" da /bio: a página vista conta o
       clique no Admin e segue para a página inicial com os mesmos UTMs. -->
  <main>
    <p>Abrindo o site…</p>
    <a id="destino" href="/">Toque aqui se não abrir</a>
  </main>
  <script>
    // Leva os UTMs desta URL para a página inicial. Segue assim que o
    // visitas.js registrar a visita, ou em 800 ms se ele demorar ou falhar.
    (function () {
      var link = document.getElementById('destino');
      try {
        var utm = new URLSearchParams();
        new URLSearchParams(window.location.search).forEach(function (valor, chave) {
          if (chave.indexOf('utm_') === 0) utm.append(chave, valor);
        });
        var query = utm.toString();
        if (query) link.setAttribute('href', '/?' + query);
      } catch (e) { /* navegador antigo: segue sem UTM */ }

      var foi = false;
      window.devbatistaSeguir = function () {
        if (foi) return;
        foi = true;
        window.location.replace(link.href);
      };
      setTimeout(window.devbatistaSeguir, 800);
    })();
  </script>
  <!-- Síncrono de propósito: o envio da página vista sai antes da linha abaixo. -->
  <script src="/js/visitas.js?v=2"></script>
  <script>window.devbatistaSeguir();</script>
</body>
</html>
